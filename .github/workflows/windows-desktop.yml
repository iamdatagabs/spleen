name: Windows desktop build

on:
  pull_request:
    paths: ["desktop/**", "backend/**", "index.html", "*.js", "*.mjs", "*.css", ".github/workflows/windows-desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "backend/**", "index.html", "*.js", "*.mjs", "*.css", ".github/workflows/windows-desktop.yml"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pyinstaller
      - name: Test backend
        run: python -m pytest backend/tests -q
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Stage local frontend assets
        working-directory: desktop
        run: npm run prepare:frontend
      - name: Package FastAPI sidecar
        run: |
          pyinstaller --clean --onefile --collect-all uvicorn --collect-all fastapi --collect-all pydantic --name spleen-api --distpath desktop/src-tauri/target/release desktop/backend_entry.py
          Copy-Item desktop/src-tauri/target/release/spleen-api.exe desktop/src-tauri/spleen-api.exe
      - name: Build Windows installers
        working-directory: desktop
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: spleen-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
