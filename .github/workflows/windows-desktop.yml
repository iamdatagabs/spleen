name: Windows desktop build

on:
  pull_request:
    paths:
      - "desktop/**"
      - "backend/**"
      - "index.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "backend/**"
      - "index.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller pytest

      - name: Test backend
        run: python -m pytest backend/tests -q

      - name: Package FastAPI sidecar
        run: |
          pyinstaller --clean --onefile --name spleen-api --distpath desktop/src-tauri/target/release desktop/backend_entry.py
          Copy-Item desktop/src-tauri/target/release/spleen-api.exe desktop/src-tauri/spleen-api.exe

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Prepare isolated frontend bundle
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, dist/docs | Out-Null
          Copy-Item ../index.html, ../styles.css, ../app.js, ../analysis.js, ../physiology.js, ../spleen3d.mjs, ../spatial-model.mjs, ../oxygen-transport.mjs, ../tissue-oxygen.mjs, ../tissue-sensitivity.mjs, ../tissue-sensitivity-ui.mjs -Destination dist/
          Copy-Item ../docs/model.md, ../docs/model.tex -Destination dist/docs/
          if (-not (Test-Path dist/index.html)) { throw "Frontend bundle is missing index.html" }
          if (-not (Test-Path dist/tissue-oxygen.mjs)) { throw "Frontend bundle is missing tissue-oxygen.mjs" }

      - name: Verify Windows application icon
        shell: pwsh
        run: |
          if (-not (Test-Path desktop/src-tauri/icons/icon.ico)) { throw "Missing desktop/src-tauri/icons/icon.ico" }
      - name: Build Windows installers
        working-directory: desktop
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: spleen-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
