name: SPLEEN model tests
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: node --check ../analysis.js && node --check ../app.js && node --check ../physiology.js && node --check ../spleen3d.mjs && node --check ../spatial-model.mjs && node --check ../oxygen-transport.mjs && node --check ../tissue-oxygen.mjs && node --check ../tissue-sensitivity.mjs && node --check ../tissue-sensitivity-ui.mjs && node --input-type=module -e "import assert from 'node:assert/strict'; import { distributeTerritoryFlow } from '../spatial-model.mjs'; const equal=distributeTerritoryFlow(0.156,[1,1,1]); assert.ok(Math.abs(equal.reduce((a,b)=>a+b,0)-0.156)<1e-12); assert.ok(equal.every(q=>Math.abs(q-0.052)<1e-12)); const skew=distributeTerritoryFlow(0.156,[0.5,1,2]); assert.ok(skew[0]>skew[1] && skew[1]>skew[2]); assert.ok(Math.abs(skew.reduce((a,b)=>a+b,0)-0.156)<1e-12); assert.deepEqual(distributeTerritoryFlow(0,[1,1,1]),[0,0,0]);" && node --test ../tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run model tests
        run: pytest -q
